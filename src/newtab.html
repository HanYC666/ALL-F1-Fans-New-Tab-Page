<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>F1 Command Center // Hyprland New Tab</title>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/widgets.css">
    <link rel="stylesheet" href="styles/settings.css">
  </head>
  <body>
    <main id="app">
      <!-- Background Layers -->
      <div id="background-layer" aria-hidden="true"></div>
      <div id="background-scrim" aria-hidden="true"></div>

      <!-- Waybar Top Status Bar (Arch / Hyprland style) -->
      <header class="waybar">
        <div class="waybar-left">
          <div class="brand-badge">
            <span class="brand-icon">F1</span>
            <span>HYPR//F1</span>
          </div>
          <div class="waybar-clock" id="waybar-clock">
            <span id="clock-time">12<span class="time-colon">:</span>00</span>
            <span class="muted" id="clock-date">SUN SEP 14</span>
          </div>
        </div>

        <div class="waybar-center">
          <div class="status-pill green" id="track-status-pill" title="Track & Telemetry Status">
            <span class="status-dot"></span>
            <span id="track-status-text">TRACK GREEN</span>
          </div>
          <nav class="team-pill-bar" id="team-pill-bar" aria-label="Quick Team Livery Switcher"></nav>
        </div>

        <div class="waybar-right">
          <button id="theme-toggle-btn" class="icon-btn" type="button" title="Toggle Light / Dark mode" aria-label="Toggle theme">
            ☀️
          </button>
          <button id="search-focus-btn" class="icon-btn" type="button" title="Focus search bar (Press /)" aria-label="Focus search">
            <span>⌕</span>
          </button>
          <button id="refresh-button" class="icon-btn" type="button" title="Refresh live F1 telemetry" aria-label="Refresh F1 data">
            <span>↻</span>
          </button>
          <button id="settings-button" class="icon-btn" type="button" aria-controls="settings-panel" aria-expanded="false" title="Open Hyprland settings" aria-label="Settings">
            <span>⚙</span>
          </button>
        </div>
      </header>

      <!-- Hero Search Section -->
      <section class="search-hero" aria-label="Search and Quick Telemetry">
        <div class="search-box-wrapper">
          <form id="google-search-form" class="search-form" action="https://www.google.com/search" method="get">
            <button type="button" id="search-engine-btn" class="search-engine-badge" title="Click to switch search engine">
              <span id="search-engine-icon">G</span>
              <span id="search-engine-name">Google</span>
            </button>
            <label class="sr-only" for="search-input">Search the web or Formula 1</label>
            <input id="search-input" class="search-input" name="q" type="search" autocomplete="off" placeholder="Search the web, F1 telemetry, drivers or press '/'…">
            <button type="submit" class="search-submit-btn" aria-label="Perform search">
              ➔
            </button>
          </form>
        </div>

        <div class="quick-f1-chips">
          <a href="https://www.google.com/search?q=f1+schedule+2026" class="f1-chip" target="_blank" rel="noopener">🏁 2026 Calendar</a>
          <a href="https://www.google.com/search?q=f1+standings" class="f1-chip" target="_blank" rel="noopener">🏆 World Championship</a>
          <a href="https://www.youtube.com/results?search_query=formula+1+highlights" class="f1-chip" target="_blank" rel="noopener">▶ Race Highlights</a>
          <a href="https://www.formula1.com/en/latest.html" class="f1-chip" target="_blank" rel="noopener">📰 Official F1 News</a>
        </div>
      </section>

      <!-- Hyprland Tiling Dashboard Grid -->
      <section id="widget-grid" aria-label="F1 telemetry and widgets"></section>

      <!-- Settings Backdrop & Modal -->
      <div id="settings-backdrop" hidden></div>
      <aside id="settings-panel" hidden aria-modal="true" role="dialog"></aside>

      <!-- Status Footer -->
      <footer id="status-footer" role="status" aria-live="polite">
        <div class="status-left">
          <span id="status-text">HYPR//F1 Command Center ready.</span>
        </div>
        <div class="status-right">
          <span class="muted">Powered by Jolpica & OpenF1 · Vanilla MV3</span>
        </div>
      </footer>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
