<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>F1 Fans</title>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/widgets.css">
    <link rel="stylesheet" href="styles/settings.css">
  </head>
  <body>
    <main id="app">
      <div id="background-layer" aria-hidden="true"></div>
      <div id="background-scrim" aria-hidden="true"></div>
      <header class="topbar">
        <h1>F1 Fans</h1>
        <div class="topbar-actions">
          <button id="refresh-button" type="button">Refresh</button>
          <button id="settings-button" type="button"
            aria-controls="settings-panel"
            aria-expanded="false">Settings</button>
        </div>
      </header>
      <section class="search-region" aria-label="Google search">
        <form id="google-search-form" action="https://www.google.com/search"
          method="get">
          <label class="sr-only" for="search-input">Search Google</label>
          <span class="search-mark" aria-hidden="true">⌕</span>
          <input id="search-input" name="q" type="search" autocomplete="off"
            placeholder="Search Google">
        </form>
      </section>
      <section id="widget-grid" aria-label="F1 dashboard widgets"></section>
      <aside id="settings-panel" hidden></aside>
      <footer id="status-footer" role="status" aria-live="polite"></footer>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
